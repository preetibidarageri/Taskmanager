<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

/* ================= BODY ================= */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#e6dfd3;

    padding:20px;
}


/* ================= FORM BOX ================= */

form{

    width:100%;

    max-width:420px;

    background:rgba(255,255,255,0.18);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.25);

    border-radius:28px;

    padding:40px 35px;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.12);

    position:relative;
}


/* Decorative Circle */

form::before{

    content:"";

    position:absolute;

    width:200px;
    height:200px;

    background:rgba(255,255,255,0.12);

    border-radius:50%;

    top:-80px;
    right:-80px;
}


/* ================= HEADING ================= */

h2{

    position:absolute;

    top:130px;

    left:50%;

    transform:translateX(-50%);

    color:#2f3e3e;

    font-size:32px;

    font-weight:600;

    z-index:2;
}


/* ================= INPUTS ================= */

form input{

    width:100%;

    padding:14px 16px;

    margin-bottom:18px;

    border:none;

    outline:none;

    border-radius:14px;

    background:rgba(255,255,255,0.82);

    font-size:14px;

    color:#2f3e3e;

    transition:0.3s;
}

form input:focus{

    background:white;

    box-shadow:
        0 0 0 4px rgba(111,143,143,0.18);
}


/* ================= BUTTON ================= */

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #6f8f8f,
            #4a5d5d
        );

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:
        0 8px 20px rgba(0,0,0,0.15);
}


/* ================= MESSAGE ================= */

p{

    text-align:center;

    margin-top:16px;

    color:#6d4c41;

    font-size:14px;
}


/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    form{

        padding:30px 22px;

        border-radius:22px;
    }

    h2{

        font-size:26px;

        top:110px;
    }

    form input{

        padding:13px;
    }

    button{

        padding:13px;
    }
}
    </style>
</head>

<body>

<h2>Reset Password</h2>

<form method="POST">

    {% csrf_token %}

    <input type="password"
           name="password"
           placeholder="New Password"
           required>

    <br><br>

    <input type="password"
           name="confirm_password"
           placeholder="Confirm Password"
           required>

    <br><br>

    <button type="submit">
        Reset Password
    </button>

</form>

{% for message in messages %}
    <p>{{ message }}</p>
{% endfor %}

</body>
</html>
